<!DOCTYPE html> 
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap-theme.min.css"/>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/js/bootstrap.min.js"></script>

    <title>Calculadora</title>
  </head>
  <body>
    <style>
        :root{
            --crimson-night: rgb(65, 0, 0);
            --midnight-plum: rgb(36, 21, 56);
            --snow-bright: #ffffff;
            --fog-white: #ebebeb;
            --golden-earth: rgb(126, 97, 25);
            --burnt-cherry: #49080d;
        }

        *{
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--burnt-cherry);
            color: var(--fog-white);
            display: grid;
            justify-content: center;
            padding: 20px;
            flex-direction: column;
            align-items: center;
        }

        .calc{
          width: 33%;
          height: 70%;
          background-color: var(--snow-bright);
          position: absolute;
          border: 4px solid var(--midnight-plum);
          border-radius: 20px;
          box-shadow: 0 0 20px rgba(36, 21, 56, 0.5);
        }

        #ans{
          width: 400px;
          height: 50px;
          margin-top: 25px;
          font-size: 20px;
          color: var(--midnight-plum);
          text-align: center;
          border-radius: 15px;
          border: 2px solid var(--golden-earth);
          background-color: var(--fog-white);
        }

        .btn input[type='button']{
          width: 70px;
          padding: 2px;
          margin: 5px;
          position: relative;
          left: 23px;
          top: 20px;
          height: 55px;
          cursor: pointer;
          font-size: 16px;
          transition: all 0.3s ease;
          background-color: var(--midnight-plum);
          color: var(--snow-bright);
          border: none;
          border-radius: 10px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .btn input[type='button']:hover{
          background-color: var(--golden-earth);
          color: var(--snow-bright);
          transform: scale(1.05);
        }

        nav.navbar{
          background-color: var(--midnight-plum) !important;
          border-bottom: 3px solid var(--golden-earth);
        }

        .navbar-brand{
          color: var(--snow-bright) !important;
          font-weight: bold;
        }

        .navbar-brand:hover{
          color: var(--golden-earth) !important;
        }

        .nav-link, .nav-item a{
          color: var(--fog-white) !important;
          font-weight: 500;
        }

        .nav-item a:hover{
          color: var(--golden-earth) !important;
        }

        .dropdown-menu{
          background-color: var(--burnt-cherry);
          border: 1px solid var(--golden-earth);
        }

        .dropdown-item{
          color: var(--fog-white);
          padding: 5px 15px;
        }

        .dropdown-item:hover{
          background-color: var(--midnight-plum);
          color: var(--golden-earth);
        }
    </style>

    <nav class="navbar navbar-light">
      <div class="container">
        <a class="navbar-brand" href="index.html">Inicio</a>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="nav navbar-nav">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="unidad1.html" id="navbarDropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">UNIDAD 1 Ciberseguridad</a>
              <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                <a class="dropdown-item" href="./index1.html">Conceptos</a><br>
                <a class="dropdown-item" href="./index2.html">Ataques</a><br>
                <a class="dropdown-item" href="./index3.html">Protección</a>
              </div>
            </li>
          </ul>

          <ul class="nav navbar-nav">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="unidad1.html" id="navbarDropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">UNIDAD 2</a>
              <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                <a class="dropdown-item" href="./index4.html">Conceptos</a></br>
                <a class="dropdown-item" href="./index5.html">Ataques</a></br>
                <a class="dropdown-item" href="./index6.html">Protección</a></br>
              </div>
            </li> 
          </ul>

          <ul class="nav navbar-nav">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="unidad1.html" id="navbarDropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">UNIDAD 3</a>
              <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                <a class="dropdown-item" href="./index7.html">Conceptos</a></br>
                <a class="dropdown-item" href="./index8.html">Ataques</a></br>
                <a class="dropdown-item" href="./index9.html">Protección</a>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="jumbot rom" style="background-color: var(--burnt-cherry); color: var(--burnt-cherry)">-
      <div class="calc">
        <input type="text" id="ans">
        <div class="btn">
          <input type="button" value='C' onclick="Clear()">
          <input type="button" value='%' onclick="Solve('%')">
          <input type="button" value='←' onclick="Solve('←')">
          <input type="button" value='/' onclick="Solve('/')">
          <br>
          <input type="button" value='7' onclick="Solve('7')">
          <input type="button" value='8' onclick="Solve('8')">
          <input type="button" value='9' onclick="Solve('9')">
          <input type="button" value='x' onclick="Solve('*')">
          <br>
          <input type="button" value='4' onclick="Solve('4')">
          <input type="button" value='5' onclick="Solve('5')">
          <input type="button" value='6' onclick="Solve('6')">
          <input type="button" value='-' onclick="Solve('-')">
          <br>
          <input type="button" value='1' onclick="Solve('1')">
          <input type="button" value='2' onclick="Solve('2')">
          <input type="button" value='3' onclick="Solve('3')">
          <input type="button" value='+' onclick="Solve('+')">
          <br>
          <input type="button" value='00' onclick="Solve('00')">
          <input type="button" value='0' onclick="Solve('0')">
          <input type="button" value='.' onclick="Solve('.')">
          <input type="button" value='=' onclick="Result()">
          <br>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      const Solve = (val) => {
        const v=document.getElementById('ans');
        v.value +=val;
      }
      const Result = () =>{
        const v1=document.getElementById('ans').value;
        const v2=eval(v1);
        document.getElementById('ans').value=v2;
      }
      const Clear = () =>{
        const input=document.getElementById('ans');
        input.value='';
      }
      const Back = () =>{
        const back=document.getElementById('ans');
        back.value=back.value.slice(0,-1);
      }
    </script>
  </body>
</html>
